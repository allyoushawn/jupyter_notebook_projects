[data]
# Number of dense features (feat1, feat2, ..., featN)
num_dense_features = 5

# Embedding dimension
embedding_dim = 32

# Number of embeddings to generate (emb_1, emb_2, ..., emb_N)
num_embeddings = 2

[generation]
start_date = 20260101
end_date = 20260101
rows_per_file = 500
files_per_hour = 4
null_probability = 0.0
output_dir = data

[options]
# If true, remove existing partition directories (ds=xxx) before generating
clean_existing = true
